{% extends "base.html" %}

{% block title %}Delete incident{% endblock %}

{% block content %}
    <h1>Delete incident</h1>
    <p>Are you sure you want to delete “{{ incident.title }}”? This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="danger">Delete</button>
            <a href="{% url 'incidents:detail' incident.pk %}">Cancel</a>
        </div>
    </form>
{% endblock %}
