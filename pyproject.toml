[project]
name = "it-incidents-reporter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==6.1.1",
    "django-jazzmin==3.0.5",
    "matplotlib==3.11.1",
    "pandas==3.0.5",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.0",
    "ipykernel==7.3.0",
    "mypy==2.3.1",
    "pdoc==16.0.0",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.6",
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# RUF012: mutable class attributes (list_display, REQUIRED_FIELDS,
# Meta.constraints...) are a common Django idiom, not a bug.
ignore = ["RUF012"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"

[tool.django-stubs]
django_settings_module = "incidents_reporter.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "incidents_reporter.settings"
python_files = ["test_*.py"]
testpaths = ["src/tests"]
