{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="actions">
            <button type="submit">Log in</button>
        </div>
    </form>

    <p><a href="{% url 'user:register' %}">Create an account</a></p>
{% endblock %}
