{% extends "base.html" %}

{% block title %}Create account{% endblock %}

{% block content %}
    <h1>Create account</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Register</button>
        </div>
    </form>

    <p><a href="{% url 'user:login' %}">Already have an account? Log in</a></p>
{% endblock %}
